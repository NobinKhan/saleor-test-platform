# Saleor reference pin — upgrade only when explicitly requested (see docs/version-upgrade.md)
# SALEOR_VERSION=3.23.7

name: saleor-test-platform

services:
  # ── Saleor (profile: saleor) ────────────────────────────────────────────────
  saleor-db:
    profiles: [saleor]
    image: cgr.dev/chainguard/postgres:latest
    container_name: saleor-db
    restart: unless-stopped
    networks: [app]
    volumes:
      - saleor_db_data:/var/lib/postgresql/data
      - ./deploy/saleor/replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
      POSTGRES_DB: saleor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor -d saleor"]
      interval: 5s
      timeout: 5s
      retries: 10

  saleor-cache:
    profiles: [saleor]
    image: valkey/valkey:8.1-alpine
    container_name: saleor-cache
    restart: unless-stopped
    networks: [app]
    volumes:
      - saleor_cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  saleor-api:
    profiles: [saleor]
    image: ghcr.io/saleor/saleor:3.23.7
    container_name: saleor-api
    restart: unless-stopped
    networks: [app]
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_healthy
    volumes:
      - saleor_media:/app/media
    env_file:
      - ./deploy/saleor/common.env
      - ./deploy/saleor/backend.env
    environment:
      DASHBOARD_URL: http://localhost:9000/
      ALLOWED_HOSTS: localhost,127.0.0.1,saleor-api,host.docker.internal

  saleor-worker:
    profiles: [saleor]
    image: ghcr.io/saleor/saleor:3.23.7
    container_name: saleor-worker
    restart: unless-stopped
    networks: [app]
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    depends_on:
      saleor-cache:
        condition: service_healthy
    volumes:
      - saleor_media:/app/media
    env_file:
      - ./deploy/saleor/common.env
      - ./deploy/saleor/backend.env

  # ── Test harness (profile: harness) ───────────────────────────────────────
  harness-db:
    profiles: [harness]
    image: cgr.dev/chainguard/postgres:latest
    container_name: harness-db
    restart: unless-stopped
    networks: [app]
    ports:
      - "5997:5432"
    volumes:
      - harness_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: saleor_test
      POSTGRES_PASSWORD: saleor_test_pass
      POSTGRES_DB: saleor_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor_test -d saleor_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  harness-backend:
    profiles: [harness]
    build:
      context: .
      dockerfile: deploy/harness/Dockerfile
    container_name: harness-backend
    restart: unless-stopped
    user: "0:0"
    networks: [app]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5998:5998"
    volumes:
      - harness_reference:/app/reference
    environment:
      DATABASE_URL: postgresql+asyncpg://saleor_test:saleor_test_pass@harness-db:5432/saleor_test
      JWT_SECRET_KEY: CHANGE_ME_IN_PRODUCTION_USE_64CHAR_SECRET
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
      TOKEN_ENCRYPTION_KEY: ""
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 5998
      FRONTEND_URL: http://localhost:5999
      # Rewrite target when UI sends localhost — reaches Saleor on the Docker host
      SALEOR_GRAPHQL_URL: http://host.docker.internal:8000/graphql/
      REFERENCE_BASELINE_VERSION: "3.23.6"
      REFERENCE_BASELINE_SOURCE: saleor-dashboard
      GOLDEN_CORPUS_VERSION: "3.23.7"
      SGRC_TIER2_GATE: "true"
      CLIENT_BUNDLES_DASHBOARD_VERSION: "3.23.6"
      REFERENCE_CORPUS_ROOT: /app/reference/corpora
      REFERENCE_SALEOR_URL: http://saleor-api:8000/graphql/
    depends_on:
      harness-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5998/api/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  harness-frontend:
    profiles: [harness]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_BACKEND_URL: http://localhost:5998
    container_name: harness-frontend
    restart: unless-stopped
    networks: [app]
    ports:
      - "5999:5999"
    environment:
      PUBLIC_BACKEND_URL: http://localhost:5998
    depends_on:
      - harness-backend

networks:
  app:
    driver: bridge

volumes:
  saleor_db_data:
  saleor_cache_data:
  saleor_media:
  harness_db_data:
  harness_reference:
